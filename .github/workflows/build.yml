name: Firmware Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (ESP32-S3)
        run: pio run -e esp32-s3-amoled-175

      - name: Upload .bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsule-radar-firmware
          path: .pio/build/esp32-s3-amoled-175/firmware.bin
          retention-days: 30
